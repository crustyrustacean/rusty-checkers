[workspace]
members = [
    "frontend",
    "backend", "common",
]
default = "backend"
resolver = "3"

[workspace.package]
version = "0.25.0"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "A full stack checkers game, with Rama and Yew."
readme = "README.md"
repository = "https://github.com/crustyrustacean/rusty-checkers.git"
license = "MIT"
publish = false

[profile.release]
lto = true         
codegen-units = 1   
strip = true        
panic = "abort"     

[profile.dev]
debug = true        

[profile.dev.package."*"]
opt-level = 2