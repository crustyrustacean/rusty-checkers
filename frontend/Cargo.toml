[package]
name = "frontend"
version.workspace = true
edition.workspace = true

[[bin]]
name = "checkers-client"
path = "src/bin/main.rs"

[lib]
name = "checkers_client_lib"
path = "src/lib.rs"

[dependencies]
common = { path = "../common" }
console_error_panic_hook = "0.1.7"
gloo-net = "0.6.0"
log = "0.4.29"
serde_json = { workspace = true }
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
wasm-logger = "0.2.0"
uuid = { version = "1", features = ["serde", "js"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomRect", "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlImageElement", "HtmlInputElement", "MouseEvent", "InputEvent"] }
yew = { version = "0.22.0", features = ["csr"] }
